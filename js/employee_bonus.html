<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    #based on employee experiance,above 10 years 20% bonus, 5 to 10 years 10% bonus, below 5 years 5% bonus
    <script>
        let experience = prompt("Enter your years of experience: ");
        let salary = prompt("Enter your salary: ");
        let bonus = 0;

        if (experience > 10) 
        {
            bonus = salary * 0.2;
        } 
        else if (experience >= 5 && experience <= 10) 
        {
            bonus = salary * 0.1;
        } 
        else if (experience < 5) 
        {
            bonus = salary * 0.05;
        }
        else 
        {
            alert("Invalid input.");
        }

        alert(`Your bonus is: ${bonus}`);
    </script>
</body>
</html>

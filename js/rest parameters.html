<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rest parameters</title>
</head>
<body>
    <script>
        function sum(...numbers) {
            return numbers.reduce((total, num) => total + num, 0);
        }

        console.log(sum(1, 2, 3));
        console.log(sum(4, 5, 6, 7)); 
    </script>
</body>
</html>

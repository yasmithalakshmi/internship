#write a program tto find the given number is positive, negative or zero
<html>
    <body>
        <script>
            let number = prompt("Enter a number: ");
            if (number > 0) 
            {
                alert("The number is positive.");
            } 
           else if (number < 0) 
            {
                alert("The number is negative.");
           }
           else 
           {
                alert("The number is zero.");
           }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>with parameters with return type</title>
</head>
<body>
    <script>
        function greet(name) {
            return "Hello, " + name + "!";
        }

        var message = greet("yashu");
        console.log(message);
    </script>
</body>
</html>

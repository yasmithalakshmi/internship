<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one parameter arrow function</title>
</head>
<body>
    <script>
        // Arrow function with one parameter and no return type
        const square = s => {
            console.log(s*s);
        };

        square(5);
    </script>
</body>
</html>

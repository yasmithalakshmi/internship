<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function stops after return</title>
</head>
<body>
    <script>
        function greet(name) {
            return name;
            console.log("This will not be executed");//this will not be executed because the function stops executing after the return statement
        }

        var message = greet("yashu");
        console.log(message);
    </script>
</body>
</html>

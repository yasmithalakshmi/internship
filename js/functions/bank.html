<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background-color: rgb(219, 237, 238);">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-primary shadow">
    <div class="container-fluid justify-content-center">
      <h2 class="text-white fw-bold">Banking System</h2>
    </div>
  </nav>

  <!-- Bank Details -->
  <div class="container d-flex justify-content-center mt-5">

    <div class="card shadow p-4 border-0 rounded-4"
         style="width:450px; min-height:400px;">

      <h3 class="text-center text-primary mb-4">
        Bank Details
      </h3>

      <label class="form-label f-semibold">
        Name
      </label>

      <input type="text"
             id="customer-name"
             class="form-control mb-3"
             placeholder="Enter name">

      <label class="form-label fw-semibold">
        Account Number
      </label>

      <input type="text"
             id="account-number"
             class="form-control mb-3"
             placeholder="Enter account number">

      <label class="form-label fw-semibold">
        Bank Balance
      </label>

      <input type="number"
             id="balance"
             class="form-control mb-4"
             placeholder="Enter balance">

      <button class="btn btn-primary w-100"
              onclick="checkBalance()">
        Check Balance
      </button>

    </div>
  </div>

  <!-- Transaction Section -->
  <div class="container mt-5">

    <h3 class="text-center text-primary mb-4">
      Transaction Details
    </h3>

    <div class="row g-4">

      <!-- Deposit -->
      <div class="col-md-6">

        <div class="card shadow border-0 rounded-4 p-4 h-100">

          <h4 class="text-center text-dark mb-4">
            Deposit
          </h4>

          <label class="form-label fw-semibold">
            Deposit Amount
          </label>

          <input type="number"
                 id="deposit-amount"
                 class="form-control mb-4"
                 placeholder="Enter amount">

          <button class="btn btn-success w-100"
                  onclick="depositMoney()">
            Deposit
          </button>

        </div>
      </div>

      <!-- Withdrawal -->
      <div class="col-md-6">

        <div class="card shadow rounded-4 p-4 h-100">

          <h4 class="text-center text-dark mb-4">
            Withdrawal
          </h4>

          <label class="form-label fw-semibold">
            Withdrawal Amount
          </label>

          <input type="number"
                 id="withdraw-amount"
                 class="form-control mb-4"
                 placeholder="Enter amount">

          <button class="btn btn-danger w-100"
                  onclick="withdrawMoney()">
            Withdraw
          </button>

        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript -->
  <script>

    function checkBalance() {

      let balance =
      document.getElementById("balance").value;

      alert("Current Balance: ₹" + balance);
    }

    function depositMoney() {

      let balance =
      Number(document.getElementById("balance").value);

      let deposit =
      Number(document.getElementById("deposit-amount").value);

      if(deposit <= 0){

        alert("Enter valid deposit amount");
        return;
      }

      balance = balance + deposit;

      document.getElementById("balance").value = balance;

      alert("Deposit Successful");
    }

    function withdrawMoney() {

      let balance =
      Number(document.getElementById("balance").value);

      let withdraw =
      Number(document.getElementById("withdraw-amount").value);

      if(withdraw <= 0){

        alert("Enter valid withdrawal amount");
        return;
      }

      if(withdraw > balance){

        alert("Insufficient Balance");
        return;
      }

      balance = balance - withdraw;

      document.getElementById("balance").value = balance;

      alert("Withdrawal Successful");
    }

  </script>

</body>
</html>

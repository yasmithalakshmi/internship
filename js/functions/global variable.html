<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>global variable</title>
</head>
<body>
    <script>
        var name = "yashu"; // Global variable

        function greet() {
            console.log(name); // Accessing the global variable
        }

        greet(); // Calling the function
    </script>
</body>
</html>

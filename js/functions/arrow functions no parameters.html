<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow functions with no parameters</title>
</head>
<body>
   <script>
    // Arrow function with no parameters and no return type
        const greet = () => {
            console.log("Hello, World!");
        };

        greet();
    </script>
   </script>
</body>
</html>

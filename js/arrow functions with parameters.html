<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow functions with parameters</title>
</head>
<body>
  <script>
    // Arrow function with parameters and no return type
        const greet = (name) => {
            console.log("Hello, " + name + "!");
        };

        greet("yashu");
  </script>  
</body>
</html>

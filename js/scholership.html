<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h2>Scholarship Eligibility Check</h2>
    <script>
        let percentage = prompt("Enter your percentage");
        let income = prompt("Enter your family income");

        if (percentage > 90 && income < 300000) 
        {
            alert("Eligible for scholarship");
        }
         else 
        {
            alert("Not eligible for scholarship");
        }
    </script>
</body>

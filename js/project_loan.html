<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   #project loan (nested statements),validate age is 21 to 79,loan amount 360000 to 2500000 ,cibil 750 to 900
   <script>
       let age = parseInt(prompt("Enter your age"));
       let loanAmount = parseInt(prompt("Enter loan amount"));
       let cibil = parseInt(prompt("Enter your CIBIL score"));

       if (age >= 21 && age <= 79) {
           if (loanAmount >= 360000 && loanAmount <= 2500000) {
               if (cibil >= 750 && cibil <= 900) {
                   alert("Loan approved");
               } else {
                   alert("Loan rejected: CIBIL score should be between 750 and 900");
               }
           } else {
               alert("Loan rejected: Loan amount should be between 360000 and 2500000");
           }
       } else {
           alert("Loan rejected: Age should be between 21 and 79");
       }
   </script>
</body>
</html>

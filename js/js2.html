<!DOCTYPE html>
<html>
<head>
    <title>Billing App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }

            #billArea, #billArea * {
                visibility: visible;
            }

            #billArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            #printBtn {
                display: none;
            }
        }
    </style>
</head>


</head>
<body class="bg-light">
    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid bg-primary">
    <span class="navbar-text text-white playfair h2 ">
      Super Market Billing App
    </span>
  </div>
</nav>
<div class="container " style="margin-left: 400px;">
    <h1 class>Product Details:-</h1>
    <div class="mb-3 w-50">
        <label class="form-label">Product Name</label>
        <input type="text" class="form-control" id="productName">
    </div>

    <div class="mb-3 w-50">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity">
    </div>

    <div class="mb-3 w-50">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" id="price">
    </div>

    <button class="btn btn-primary" onclick="generateBill()">Generate Bill</button>
</div>

    <div id="billArea" class="mt-4 p-3 bg-white border" style="display:none;">
        <h3 class="text-center">Super Market Bill</h3>

        <table class="table table-bordered">
            <tr>
                <td><b>Product Name</b></td>
                <td id="bname"></td>
            </tr>
            <tr>
                <td><b>Quantity</b></td>
                <td id="bqty"></td>
            </tr>
            <tr>
                <td><b>Price</b></td>
                <td id="bprice"></td>
            </tr>
            <tr>
                <td><b>Total</b></td>
                <td id="btotal"></td>
            </tr>
            <tr>
                <td><b>GST 18%</b></td>
                <td id="bgst"></td>
            </tr>
            <tr>
                <td><b>Amount</b></td>
                <td id="bamount"></td>
            </tr>
        </table>

        <button id="printBtn" class="btn btn-success" onclick="window.print();">Print Bill</button>
        <button id="closeBtn" class="btn btn-success" onclick=" clearBill();">clear bill</button>
        
    </div>

<script>
function generateBill() {
    let pname = document.getElementById("productName").value;
    let qty = Number(document.getElementById("quantity").value);
    let price = Number(document.getElementById("price").value);

    let total = qty * price;
    let gst = total * 0.18;
    let amount = total + gst;
    alert(
        "Product Name : " + pname +
        "\nQuantity : " + qty +
        "\nPrice : ₹" + price +
        "\nTotal : ₹" + total +
        "\nGST (18%) : ₹" + gst +
        "\nAmount : ₹" + amount
    );

    document.getElementById("bname").innerHTML = pname;
    document.getElementById("bqty").innerHTML = qty;
    document.getElementById("bprice").innerHTML = "Rs. " + price;
    document.getElementById("btotal").innerHTML = "Rs. " + total.toFixed(2);
    document.getElementById("bgst").innerHTML = "Rs. " + gst.toFixed(2);
    document.getElementById("bamount").innerHTML = "Rs. " + amount.toFixed(2);

    document.getElementById("billArea").style.display = "block";
}
function clearBill(){

    document.getElementById("productName").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";
      document.getElementById("billArea").style.display = "none";

}
</script>

</body>
</html>

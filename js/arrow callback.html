<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow callback</title>
</head>
<body>
    <script>
        function greet(name, callback) {
            console.log(name);
            callback();
        }

        greet("yashu", () => {
            console.log("Goodbye!");
        });
    </script>
</body>
</html>

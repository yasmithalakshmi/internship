<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>palindrome</title>
    <script>
        function checkPalindrome() {
            let n = parseInt(document.getElementById('n').value);
            let reversed = 0;
            while (n > 0) {
                let digit = n % 10;
                reversed = reversed * 10 + digit;
                n = Math.floor(n / 10);
            }
            let original = parseInt(document.getElementById('n').value);
            document.getElementById('result').innerHTML = original === reversed ? "The number is a palindrome." : "The number is not a palindrome.";
        }
        </script>
        <style>
            .container {
                width: 400px;
                margin: 0 auto;
                padding: 20px;
                background-color: #b0a5a5;
                border-radius: 8px;
            
            }
            .txt-center {
                text-align: center;
                font-size: 24px;
            }
            .mt-5 {
                margin-top: 3rem;
            }
        </style>
</head>
<body>
    <div class="container txt-center mt-5">
        <h1>Check Palindrome</h1>
        <label for="n">Enter a number:</label>
        <input type="number" id="n" placeholder="Enter a number">
        <br><br>
        <button onclick="checkPalindrome()">Check Palindrome</button>
        <br><br>
        <label id="result" class="mt-3"> result</label>
    </div>
</body>
</html>

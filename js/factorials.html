<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factorials</title>
    <script>
        function calculateFactorials() {
            const n = parseInt(document.getElementById('n').value);
            let factorial = 1;
            for (let i = 1; i <= n; i++) {
                factorial *= i;
            }
            document.getElementById('result').innerHTML = factorial;
        }
        </script>
        <style>
            .container {
                width: 400px;
                margin: 0 auto;
                padding: 20px;
                background-color: #b0a5a5;
                border-radius: 8px;
            
            }
            .txt-center {
                text-align: center;
                font-size: 24px;
            }
            .mt-5 {
                margin-top: 3rem;
            }
        </style>
</head>
<body>
    <div class="container txt-center mt-5">
        <h1>factorials of given number</h1>
        <label for="n">Enter a number:</label>
        <input type="number" id="n" placeholder="Enter a number">
        <br><br>
        <button onclick="calculateFactorials()">Calculate Factorials</button>
        <br><br>
        <label id="result" class="mt-3"> result</label>
    </div>
</body>
</html>

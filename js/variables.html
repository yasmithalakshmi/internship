<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variable</title>
</head>
<body>
   <script>
     var name = "yashu";
     console.log(name);
     var name = "yash";
     console.log(name);
     name = "yashmitha";
     console.log(name);
     let age = 20;
     console.log(age);
     age = 21;
     console.log(age);
     const pi = 3.14;
     console.log(pi);
     pi = 3.14159; 
     console.log(pi);
   </script> 
</body>
</html>

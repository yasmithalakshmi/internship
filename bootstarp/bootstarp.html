<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Cards and Forms</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

  <h1 class="text-center mb-5">Bootstrap Cards & Forms</h1>

  <!-- Cards Section -->
  <h3>Cards</h3>

  <div class="row g-4">

    <!-- Basic Card -->
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Basic Card</h5>
          <p class="card-text">
            This is a simple Bootstrap card with title and text.
          </p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>


    <!-- Card with Image -->
    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://via.placeholder.com/400x200" class="card-img-top">

        <div class="card-body">
          <h5 class="card-title">Image Card</h5>
          <p class="card-text">
            Card with an image, content, and button.
          </p>
          <button class="btn btn-success">View</button>
        </div>
      </div>
    </div>


    <!-- Colored Card -->
    <div class="col-md-4">
      <div class="card bg-dark text-white shadow">
        <div class="card-body">
          <h5 class="card-title">Dark Card</h5>
          <p class="card-text">
            Bootstrap cards support background colors.
          </p>
          <button class="btn btn-light">Explore</button>
        </div>
      </div>
    </div>

  </div>


  <!-- Form Section -->
  <h3 class="mt-5">Forms</h3>

  <form class="bg-white p-4 rounded shadow">

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>


    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Enter your email">
    </div>


    <!-- Password -->
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" placeholder="Password">
    </div>


    <!-- Select -->
    <div class="mb-3">
      <label class="form-label">Country</label>

      <select class="form-select">
        <option>Select Country</option>
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
      </select>

    </div>


    <!-- Radio -->
    <div class="mb-3">
      <label class="form-label">Gender</label><br>

      <input type="radio" class="form-check-input">
      <label class="form-check-label">Male</label>

      <input type="radio" class="form-check-input ms-3">
      <label class="form-check-label">Female</label>

    </div>


    <!-- Checkbox -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input">
      <label class="form-check-label">
        Accept terms and conditions
      </label>
    </div>


    <!-- Message -->
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="4"></textarea>
    </div>


    <button class="btn btn-primary">
      Submit
    </button>

    <button type="reset" class="btn btn-secondary">
      Reset
    </button>

  </form>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

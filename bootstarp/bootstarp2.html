<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap All Buttons & Fonts</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    .poppins {
      font-family: 'Poppins', sans-serif;
    }

    .roboto {
      font-family: 'Roboto', sans-serif;
    }

    .montserrat {
      font-family: 'Montserrat', sans-serif;
    }

    .custom-btn {
      padding: 10px 25px;
      margin: 5px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body class="container text-center py-5">

  <h1 class="poppins">Bootstrap Buttons & Fonts</h1>

  <h3 class="roboto mt-5">Solid Buttons</h3>

  <button class="btn btn-primary custom-btn">Primary</button>
  <button class="btn btn-secondary custom-btn">Secondary</button>
  <button class="btn btn-success custom-btn">Success</button>
  <button class="btn btn-danger custom-btn">Danger</button>
  <button class="btn btn-warning custom-btn">Warning</button>
  <button class="btn btn-info custom-btn">Info</button>
  <button class="btn btn-light custom-btn">Light</button>
  <button class="btn btn-dark custom-btn">Dark</button>

  <h3 class="roboto mt-5">Outline Buttons</h3>

  <button class="btn btn-outline-primary custom-btn">Primary</button>
  <button class="btn btn-outline-secondary custom-btn">Secondary</button>
  <button class="btn btn-outline-success custom-btn">Success</button>
  <button class="btn btn-outline-danger custom-btn">Danger</button>
  <button class="btn btn-outline-warning custom-btn">Warning</button>
  <button class="btn btn-outline-info custom-btn">Info</button>
  <button class="btn btn-outline-dark custom-btn">Dark</button>

  <h3 class="montserrat mt-5">Button Sizes</h3>

  <button class="btn btn-primary btn-lg">Large Button</button>
  <button class="btn btn-primary">Normal Button</button>
  <button class="btn btn-primary btn-sm">Small Button</button>

  <h3 class="mt-5">Font Examples</h3>

  <p class="poppins fs-1">Poppins Font</p>
  <p class="roboto fs-2">Roboto Font</p>
  <p class="montserrat fs-3">Montserrat Font</p>

  <p class="fw-bold">Bold Text</p>
  <p class="fw-normal">Normal Text</p>
  <p class="fst-italic">Italic Text</p>

</body>
</html>

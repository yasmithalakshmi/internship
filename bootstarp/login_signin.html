<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background-color: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            width: 520px;
            max-width: 100%;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        /* Right side */

        .form-section {
            padding: 45px;
            width: 100%;
        }

        .form-title {
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }

        .form-description {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            height: 45px;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.15rem rgba(99, 102, 241, 0.15);
        }

        .password-box {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            color: #777;
        }

        .main-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 7px;

            background-color: #4f46e5;
            color: white;

            font-weight: bold;
        }

        .main-btn:hover {
            background-color: #4338ca;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .switch-link {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .success-message {
            color: #198754;
            font-size: 13px;
            margin-top: 10px;
        }

        #signupBox {
            display: none;
        }

        .password-strength {
            font-size: 12px;
            margin-top: 5px;
        }
        /*divider*/
        .divider {
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 20px 0;
          color: #999;
          font-size: 12px;
        }

       .divider::before,
       .divider::after {
          content: "";
          flex: 1;
          height: 1px;
          background-color: #ddd;
        }

       .google-btn {
          width: 100%;
          height: 45px;
          border: 1px solid #ddd;
          border-radius: 7px;
           margin: 20px 0;
          background-color: white;
          color: #333;
          font-weight: 600;
          cursor: pointer;
        }

       .google-btn:hover {
          background-color: #f7f7f7;
          border-color: #bbb;
        }

      

      .google-btn i {
        margin-right: 8px;
        

         }
        /*terms and conditions*/
        #termsandconditions{
            display: none;
        }

        /* Mobile */

        @media (max-width: 576px) {

            body {
                padding: 15px;
            }

            .main-container {
                min-height: 100vh;
            }

            .auth-box {
                width: 100%;
                max-width: 100%;
                border-radius: 12px;
            }

            .form-section {
                padding: 30px 20px;
            }

            .form-title {
                font-size: 25px;
            }

            .form-description {
                font-size: 13px;
                margin-bottom: 25px;
            }

            .d-flex.justify-content-between {
                gap: 10px;
            }

            .forgot-link {
                font-size: 12px;
            }

        }

        @media (min-width: 577px) and (max-width: 768px) {

            .auth-box {
                width: 500px;
                max-width: 95%;
            }

            .form-section {
                padding: 35px 30px;
            }

        }

    </style>

</head>


<body>


<div class="main-container">

    <div class="auth-box">

        <div class="row g-0">
            
            
            <!-- RIGHT SECTION -->

            <div class="col-md-12">

                <div class="form-section">


                    <!-- LOGIN -->

                    <div id="loginBox">

                        <h2 class="form-title">
                            Login
                        </h2>

                        <p class="form-description">
                            Enter your details to access your account.
                        </p>


                        <form id="loginForm">


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    placeholder="Enter your email">

                                <div id="loginEmailError"
                                    class="error-message">
                                </div>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <div class="password-box">

                                    <input
                                        type="password"
                                        id="loginPassword"
                                        class="form-control"
                                        placeholder="Enter your password">

                                    <i
                                        class="bi bi-eye show-password"
                                        onclick="showPassword('loginPassword', this)">
                                    </i>

                                </div>

                                <div id="loginPasswordError"
                                    class="error-message">
                                </div>

                            </div>


                            <!-- REMEMBER -->

                            <div class="d-flex justify-content-between
                                align-items-center mb-4">

                                <div class="form-check">

                                    <input
                                        type="checkbox"
                                        class="form-check-input"
                                        id="remember">

                                    <label
                                        class="form-check-label"
                                        for="remember">

                                        Remember me

                                    </label>

                                </div>

                                <a href="#"
                                    style="font-size:13px;
                                    color:#4f46e5;
                                    text-decoration:none;">

                                    Forgot password?

                                </a>

                            </div>


                            <!-- BUTTON -->

                            <button
                                type="submit"
                                class="main-btn">

                                Login

                            </button>


                            <div
                                id="loginSuccess"
                                class="success-message">
                            </div>

                        </form>


                        <div class="switch-text">

                            Don't have an account?

                            <span
                                class="switch-link"
                                onclick="showSignup()">

                                to sign up.

                            </span>

                        </div>

                    </div>



                    <!-- SIGNUP -->

                    <div id="signupBox">

                        <h2 class="form-title">
                            sign up
                        </h2>

                        <p class="form-description">
                            Create your account in a few simple steps.
                        </p>


                        <form id="signupForm">


                            <!-- NAME -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your name">

                                <div id="nameError"
                                    class="error-message">
                                </div>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="signupEmail"
                                    class="form-control"
                                    placeholder="Enter your email">

                                <div id="signupEmailError"
                                    class="error-message">
                                </div>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-2">

                                <label class="form-label">
                                    Password
                                </label>

                                <div class="password-box">

                                    <input
                                        type="password"
                                        id="signupPassword"
                                        class="form-control"
                                        placeholder="Create a password">

                                    <i
                                        class="bi bi-eye show-password"
                                        onclick="showPassword('signupPassword', this)">
                                    </i>

                                </div>

                                <div
                                    id="passwordStrength"
                                    class="password-strength">
                                </div>

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Confirm your password">

                                <div
                                    id="confirmError"
                                    class="error-message">
                                </div>

                            </div>


                            <!-- TERMS -->

                            <div class="form-check mb-4">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="terms">

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the Terms & Conditions 
                                    <a id="readmore" style="color: #8d8ff2;">  read more..</a>
                                    <div id="termsandconditions">
                                       Terms & Conditions

                                        By creating an account, you agree to use this website responsibly and provide accurate information during registration.

                                        You are responsible for keeping your account information and password secure. Please do not share your password with anyone.

                                        You agree not to use this website for any illegal, harmful, or unauthorized activities.

                                        We may update these terms from time to time. Continued use of the website after changes means that you accept the updated terms.

                                        By clicking "Create Account", you confirm that you have read and agree to these Terms & Conditions and our Privacy Policy.
                                        <a id="showless" style="color: #8d8ff2;">  read less..</a>
                                    </div>

                                </label>

                            </div>

                            <!-- OR DIVIDER -->

                           <div class="divider">
                               <span>OR</span>
                           </div>


                           <!-- GOOGLE BUTTON -->

                           <button
                             type="button"
                             class="google-btn">

                             <i class="bi bi-google"></i>
                               Continue with Google

                            </button>


                            <!-- BUTTON -->

                            <button
                                type="submit"
                                class="main-btn">

                                Create Account

                            </button>


                            <div
                                id="signupSuccess"
                                class="success-message">
                            </div>

                        </form>


                        <div class="switch-text">

                            Already have an account?

                            <span
                                class="switch-link"
                                onclick="showLogin()">

                                Login

                            </span>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>



<!-- jQuery -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script>


/* ================================
   SHOW LOGIN
================================ */

function showLogin() {

    $("#signupBox").fadeOut(200, function () {

        $("#loginBox").fadeIn(300);

    });

}


/* ================================
   SHOW SIGNUP
================================ */

function showSignup() {

    $("#loginBox").fadeOut(200, function () {

        $("#signupBox").fadeIn(300);

    });


}


/* ================================
   SHOW / HIDE PASSWORD
================================ */

function showPassword(id, icon) {

    let password =
        document.getElementById(id);

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}


/* ================================
   LOGIN VALIDATION
================================ */

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    let email =
        document.getElementById("loginEmail").value.trim();

    let password =
        document.getElementById("loginPassword").value.trim();


    document.getElementById("loginEmailError")
        .innerHTML = "";

    document.getElementById("loginPasswordError")
        .innerHTML = "";

    document.getElementById("loginSuccess")
        .innerHTML = "";


    let valid = true;


    /* EMAIL */

    if (email === "") {

        document.getElementById("loginEmailError")
            .innerHTML = "Please enter your email.";

        valid = false;

    }


    /* PASSWORD */

    if (password === "") {

        document.getElementById("loginPasswordError")
            .innerHTML = "Please enter your password.";

        valid = false;

    }


    /* SUCCESS */

    if (valid) {

        document.getElementById("loginSuccess")
            .innerHTML =
            "Login successful! (Demo only)";

    }

});


/* ================================
   SIGNUP VALIDATION
================================ */

document.getElementById("signupForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    let name =
        document.getElementById("name").value.trim();

    let email =
        document.getElementById("signupEmail").value.trim();

    let password =
        document.getElementById("signupPassword").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    let terms =
        document.getElementById("terms").checked;


    document.getElementById("nameError")
        .innerHTML = "";

    document.getElementById("signupEmailError")
        .innerHTML = "";

    document.getElementById("confirmError")
        .innerHTML = "";

    document.getElementById("signupSuccess")
        .innerHTML = "";


    let valid = true;


    /* NAME */

    if (name === "") {

        document.getElementById("nameError")
            .innerHTML =
            "Please enter your name.";

        valid = false;

    }


    /* EMAIL */

    if (email === "") {

        document.getElementById("signupEmailError")
            .innerHTML =
            "Please enter your email.";

        valid = false;

    }


    /* PASSWORD */

    if (password.length < 6) {

        document.getElementById("passwordStrength")
            .innerHTML =
            "Password must contain at least 6 characters.";

        document.getElementById("passwordStrength")
            .style.color = "#dc3545";

        valid = false;

    }


    /* CONFIRM PASSWORD */

    if (password !== confirmPassword) {

        document.getElementById("confirmError")
            .innerHTML =
            "Passwords do not match.";

        valid = false;

    }


    /* TERMS */

    if (!terms) {

        alert("Please accept the Terms & Conditions.");

        valid = false;

    }


    /* SUCCESS */

    if (valid) {

        document.getElementById("signupSuccess")
            .innerHTML =
            "Account created successfully! (Demo only)";

        document.getElementById("signupForm")
            .reset();

    }

});


/* ================================
   PASSWORD STRENGTH
================================ */

document.getElementById("signupPassword")
.addEventListener("input", function() {

    let password = this.value;

    let strength =
        document.getElementById("passwordStrength");


    if (password.length === 0) {

        strength.innerHTML = "";

    }

    else if (password.length < 6) {

        strength.innerHTML =
            "Weak password";

        strength.style.color = "#dc3545";

    }

    else if (password.length < 10) {

        strength.innerHTML =
            "Medium password";

        strength.style.color = "#ffc107";

    }

    else {

        strength.innerHTML =
            "Strong password";

        strength.style.color = "#198754";

    }

});

/*===============================
  for terms and conditions
  =============================*/
  $(document).ready(function(){
    $("#readmore").click(function(){
        $("#termsandconditions").slideDown(1000);
        $("#readmore").fadeOut();
    });
    $("#showless").click(function(){
        $("#termsandconditions").slideUp(1000);
        $("#readmore").fadeIn()
    });
  });

/* ================================
   SMALL jQUERY EFFECT
================================ */

$(document).ready(function() {

    $(".form-control").focus(function() {

        $(this).css(
            "background-color",
            "#fafaff"
        );

    });


    $(".form-control").blur(function() {

        $(this).css(
            "background-color",
            "white"
        );

    });

});


</script>

</body>

</html>

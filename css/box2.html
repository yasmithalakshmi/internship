<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nested Boxes</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
    font-family:Arial, sans-serif;
}

.container{
    width:100%;
    height:100%;
    background:#bfbfbf;
    border:2px solid black;
    padding:10px;
}

.box1{
    width:100%;
    height:100%;
    background:#b00000;
    position:relative;
}

.box2{
    width:80%;
    height:75%;
    background:darkgreen;
    color:white;
    padding:10px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="box1">
        <div class="box2">
            
        </div>
    </div>
</div>

</body>
</html>

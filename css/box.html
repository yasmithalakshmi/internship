<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout 2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.container{
    width:100%;
    height:100vh;
}

.row{
    display:flex;
}

.top{
    height:30%;
}

.middle{
    height:40%;
}

.bottom{
    height:30%;
}

.box{
    border:2px solid white;
}

/* Top Row */
.blue{
    flex:2;
    background:#1976d2;
}

.pink{
    flex:1;
    background:#ec407a;
}

.yellow{
    flex:1;
    background:#fbc02d;
}

/* Middle Row */
.green{
    flex:1;
    background:#43a047;
}

.red{
    flex:2;
    background:#e53935;
}

/* Bottom Row */
.orange{
    flex:1;
    background:#fb8c00;
}

.purple{
    flex:1;
    background:#7b1fa2;
}

.brown{
    flex:1;
    background:#795548;
}

.sky{
    flex:1;
    background:#29b6f6;
}
    </style>
</head>
<body>

<div class="container">

    <!-- Top Row -->
    <div class="row top">
        <div class="box blue"></div>
        <div class="box pink"></div>
        <div class="box yellow"></div>
    </div>

    <!-- Middle Row -->
    <div class="row middle">
        <div class="box green"></div>
        <div class="box red"></div>
    </div>

    <!-- Bottom Row -->
    <div class="row bottom">
        <div class="box orange"></div>
        <div class="box purple"></div>
        <div class="box brown"></div>
        <div class="box sky"></div>
    </div>

</div>

</body>
</html>
